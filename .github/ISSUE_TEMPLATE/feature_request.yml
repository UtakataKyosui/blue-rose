name: 機能要望・改善提案
description: 新機能や改善のアイデアを提案する
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景・解決したい課題
      description: 何に困っているか、なぜ必要かを書いてください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: 望ましい動作や見た目を具体的に書いてください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した他の方法があれば書いてください。
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: どうなれば完了とみなせるかを箇条書きで書いてください。
      placeholder: |
        - [ ] ……
